services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=test_card
      - POSTGRES_USER=test_card
      - POSTGRES_PASSWORD=test_card
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_card -d test_card"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app: 
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://test_card:test_card@postgres:5432/test_card?schema=public
      - PORT=3000
      - CHECKPOINT_DISABLE=1
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  postgres_data:
  